# Copy to config.yaml and edit.
#
# SCALPING defaults: 3-minute candles, small targets (1.5R), a time stop and
# a break-even stop, flat before the close, many small trades a day.

# Timeframe for scalp analysis: MIN_3 (default) or MIN_1 for faster scalps. Maps to moomoo KLType via
# src/moomoo_client.py's RESOLUTION_MAP: MIN_1, MIN_3, MIN_5, MIN_15, HOUR_1,
# HOUR_4, DAY. moomoo has no historical 4h K-line, so HOUR_4 is built
# from 60-minute bars (4 per group, per trading day).
# Note: each distinct symbol you pull history for uses moomoo's 7-day
# historical K-line quota.
timeframe: "MIN_3"

# Kronos offline model configuration
kronos:
  model_name: "NeoQuasar/Kronos-base"      # Local offline model in HF cache
  tokenizer_name: "NeoQuasar/Kronos-Tokenizer-base"
  device: "cpu"                            # "cpu" or "cuda"
  max_context: 512
  local_files_only: true                   # Enforce offline mode (no network call to HuggingFace)
  sample_count: 3                          # Number of prediction paths to average
  temperature: 0.5                         # Lower for more stable predictions
  top_p: 0.9
  verbose: false

# Self-learning: fine-tune the offline Kronos model on your own markets.
# The agent saves the candles of every symbol it screened, decided on or
# traded (all brokers) at each market close into data/training/. A training
# run then follows the Kronos repository's fine-tuning method on those
# candles, with extra weight on the bars where the agent asked Kronos for a
# verdict (winning and losing signals alike), and scores the result against
# the original on the most recent candles, which it never trains on.
# A new model is NEVER used for trading by itself: pick it on the dashboard
# (Kronos Model Lab -> Self-learning) or set kronos.model_name to its folder.
#   ./start.sh finetune check     can this computer do it, and how long?
#   ./start.sh finetune train     run now
finetune:
  enabled: false           # collect candles automatically (and train on schedule, if set)
  collect_on_close: true
  bars_per_symbol: 1500
  max_symbols: 150         # symbols collected per broker
  train_time: ""           # local "HH:MM", e.g. "05:30"; empty = only when you start it
  train_days: [sat]        # scheduled runs start only while every market is closed
  max_steps: 1500
  max_minutes: 240         # hard time limit for one run
  batch_size: 8            # windows per training step on this computer (the GPU kit uses 32)
  learning_rate: 0.00004
  signal_fraction: 0.3     # share of each batch taken from the agent's own signal bars
  val_fraction: 0.15       # most recent share of candles held out for the comparison
  train_tokenizer: false   # also fine-tune the tokenizer first; needs far more data
  device: auto             # auto = an NVIDIA GPU if PyTorch can use one, else the CPU
  keep_runs: 3             # training runs kept; the model in use and the shadow model are always kept
  releases_repo:           # owner/name for saved model versions (GitHub Releases); empty = this clone's GitHub origin
  # Shadow mode: a fine-tuned model folder that is asked alongside the
  # trading model on every signal. Its answer is only recorded (data/shadow.db)
  # and compared on the dashboard; it can never place or block a trade.
  # Normally set from the dashboard ("Shadow test" on a training run).
  shadow_model:

# How many closed bars to keep in the rolling lookback window fed to
# Kronos. Kronos-small/base support up to 512 context bars.
lookback_bars: 300

# How many bars ahead to forecast for the confirmation signal. Scalps live
# for a few candles, so a short horizon (3 x 3-minute candles = 9 minutes).
forecast_horizon: 3

# Minimum Kronos confidence (0-1, probability price moves in the
# pattern's implied direction) required to confirm a trade.
kronos_confidence_threshold: 0.62

# Indicator confirmation - runs after a candlestick pattern fires and
# BEFORE Kronos, so setups that fight the indicators are dropped without
# a forecast. Uses EMA 9/20/50/200, ADX, Supertrend, RSI, MACD,
# Stochastic, Bollinger, Donchian, volume/OBV (+ session VWAP intraday).
# It can only reject signals, never create them; risk.py stays last.
indicators:
  enabled: true
  mode: filter             # filter = may reject; log = record in audit/dashboard only
  min_alignment: 0         # indicator bias score toward the trade, -100..100 (0 = not net against it)
  require_ma_trend: false  # true: BUY only if EMA fast > slow, SELL only if fast < slow
  ma_fast: 20
  ma_slow: 50
  ma_kind: ema             # sma | ema | wma | hma | vwma
  max_rsi_for_buy: 75      # skip BUYs when RSI is this high (null = off)
  min_rsi_for_sell: 25     # skip SELLs when RSI is this low (null = off)
  min_bars: 60             # fewer closed bars -> check is skipped, signal passes

# Your own rules, written in plain Markdown in config/skills.md (until that
# file exists, config/skills.example.md is read - a set of common
# price-action rules to start from). Runs after the indicator check and
# before Kronos; a rule can only stop a signal, never create one. Edit the
# rules on the dashboard (Strategies & Tactics -> Your rules) or in any
# editor - changes are picked up without a restart.
skills:
  enabled: false
  mode: log                # log = record what a rule would stop; filter = stop the signal
  file: config/skills.md

# Order execution type: "LIMIT" (recommended) or "MARKET". Entries are
# DAY orders. MARKET is only used while the session is open - outside
# it a LIMIT at the last close is placed instead. Exit orders (stop and
# target) are placed once the entry fills: GTC on live accounts, DAY on
# paper accounts (moomoo paper rejects GTC) - DAY exits are re-placed at
# every session open. MOOMOO_EXIT_TIF in .env can force GTC or DAY.
order_type: "LIMIT"

# Cancel an entry that is still completely unfilled after this many
# minutes, so a stale limit doesn't block the symbol for the session.
entry_timeout_minutes: 6       # two 3-minute candles

# false (recommended): only evaluate signals and submit entries while the
# exchange session is open. A bar that closes after hours is evaluated at
# the next open, so no order sits queued overnight and fills on a gap.
# Exchange holidays and early closes are respected (src/market_calendar.py).
trade_outside_market_hours: false

# Trailing stop - once enabled, the position monitor (running on its
# own faster cadence, independent of the candle-scan loop) ratchets the
# stop in the favorable direction as price moves, and closes the
# position if price crosses the stop or reaches the target.
trailing_stop:
  enabled: true
  check_interval_seconds: 5   # scalps: watch open trades every few seconds
  trigger_points: 2.00   # price units - profit distance before trailing engages
  trail_distance: 3.00   # price units - fixed trail distance behind the best price
  trigger_pct: 0.3       # % of entry - replaces trigger_points when set
  trail_pct: 0.2         # % of the best price - replaces trail_distance when set
  use_atr: false
  atr_multiplier: 3.0

# Symbols to trade, as moomoo codes ("US.AAPL", "HK.00700", "SG.D05")
# or bare tickers (the MOOMOO_TRADE_MARKET prefix is added).
# Static symbol list - only used when screener.enabled is false.
symbols:
  - symbol: "US.AAPL"
    name: "Apple"
    quantity: 10
  - symbol: "US.MSFT"
    name: "Microsoft"
    quantity: 5

# Default order quantity applied to symbols selected by the screener
# (screener candidates don't carry a per-symbol quantity of their own).
default_quantity: 10

# Dynamic screener - when enabled, replaces the static `symbols:` list
# above with a periodically-refreshed set ranked by volatility (ATR%)
# and filtered by price range and liquidity.
screener:
  enabled: false

  # The screened market is MOOMOO_TRADE_MARKET from .env.

  # Universe source - leave empty to screen the entire market via
  # get_stock_basicinfo(), or list specific codes to screen within
  # (faster and quota-friendly - see src/screener.py docstring).
  candidate_symbols:
    - "US.AAPL"
    - "US.MSFT"
    - "US.NVDA"
    - "US.AMZN"
    - "US.META"
    - "US.GOOGL"
    - "US.AMD"
    - "US.TSLA"

  # Price range filter (market currency) - candidates outside are excluded.
  min_price: 5.0
  max_price: 500.0

  # Minimum average volume (last 20 bars) to be considered liquid enough.
  min_avg_volume: 1000000

  # ATR (Average True Range) as % of price - the volatility band you
  # want to trade. Too low = not enough movement to hit targets; too
  # high = whipsaw risk.
  atr_period: 14
  min_atr_pct: 0.5
  max_atr_pct: 8.0

  # How many top-ranked candidates to actively trade at once.
  top_n: 5

  # How often to re-run the screener and refresh the active symbol list.
  refresh_interval_minutes: 360

  # moomoo "Market Movers" lists to start each screen from (moomoo, US/HK
  # markets only - needs a recent moomoo-api and OpenD). The lists are read
  # every refresh, merged with candidate_symbols above, and then go through
  # the same price / volume / ATR filters, score, patterns, Kronos and risk
  # rules as any other symbol. Empty = off.
  #   top_gainers   today's biggest % gainers
  #   top_losers    today's biggest % losers
  #   hot_list      most traded / searched / in the news
  #   movers_5min   biggest moves over the last 5 minutes
  #   short_selling biggest change in short volume (daily data, max 35)
  sources: []              # e.g. [top_gainers, movers_5min, hot_list]
  per_source: 30

  # Stock score - ranks the candidates that pass the filters above on
  # three things scalpers look for, measured on the agent's own
  # timeframe bars:
  #   relative strength  return over rs_lookback bars vs the benchmark
  #   relative volume    last few bars' volume vs the usual
  #   squeeze            how tight the Bollinger bands are vs the
  #                      symbol's own recent history (coiled = high)
  # It only decides WHICH symbols get scanned. Patterns, the indicator
  # check, Kronos and the risk rules then work exactly as before.
  score:
    mode: disabled         # disabled | log (show on the dashboard, still rank by ATR%) | rank (pick top scores)
    benchmark:             # e.g. "US.SPY"; empty = the market's main index ETF
    rs_lookback: 60
    rvol_recent: 3
    rvol_period: 20
    squeeze_period: 20
    weight_relative_strength: 50
    weight_relative_volume: 25
    weight_squeeze: 25
    min_relative_strength: # rank mode: drop symbols lagging the benchmark by more than this %, e.g. -5

risk:
  # Max number of concurrent open positions across all symbols
  max_open_positions: 3
  # Max order quantity per single position
  max_stake_per_point: 200
  # Stop loss / take profit distance in price units (market currency)
  stop_loss_points: 4.0
  take_profit_points: 8.0
  # Hard daily loss cap in market currency - trading halts if breached.
  # The day rolls over at midnight in the exchange's timezone.
  max_daily_loss: 300.0
  # Minimum minutes between trades on the same symbol (persists across restarts)
  min_minutes_between_trades: 5
  # false: SELL signals are rejected rather than opening a short position
  # (shorting needs a margin account with borrow at moomoo).
  allow_short: false
  # Order quantities must be a multiple of this. US = 1; SGX board lot =
  # 100; HK lot size varies per stock (check get_market_snapshot lot_size).
  lot_size: 1

  # ---- Day-trader rules (from the Day Trader skill pack) ----------------
  # All OFF while empty (null) / false. They act only after patterns, the
  # indicator gate and Kronos have approved a signal - they never change
  # what Kronos sees. Exits are never blocked. Editable on the dashboard's
  # Risk Model screen. Suggested starting preset in the comments.
  #
  # Size each order from the loss at the stop instead of a fixed quantity:
  # quantity = max_loss_per_trade / stop distance, capped by
  # max_stake_per_point, max_position_pct and cash_buffer_pct, rounded
  # down to lot_size. A stop too wide for even one lot skips the trade.
  max_loss_per_trade: 50            # account currency
  max_position_pct: null            # e.g. 75  (% of account value in one position)
  cash_buffer_pct: null             # e.g. 10  (% of account value always left in cash)
  # Skip trades whose target is closer than this many times the stop.
  min_reward_risk: 1.0
  max_trades_per_day: 20            # new entries per exchange day
  # true: the daily cap counts closed P&L + what every open position loses
  # if its stop fills + the new trade's max loss (not just closed P&L).
  daily_loss_includes_open_risk: false
  # Stop = K x ATR of the signal bars (replaces the % / points stop), and
  # target = R x the stop distance (replaces the % / points target).
  stop_atr_multiple: 1.0           # stop = 1 ATR of the 3-minute candles
  atr_period: 14
  target_r_multiple: 1.5           # target = 1.5 x the stop distance
  # Refuse stops tighter than this % of the price (spread and noise).
  min_stop_pct: 0.05                # spread and noise
  # Entry window: no new entries in the first / last N minutes of the
  # regular session (holidays and 1 pm early closes handled).
  no_entries_first_minutes: 5       # 09:35 ET on US: skip the opening print
  no_entries_last_minutes: 20       # 15:40 ET on US
  # Day-trade mode: close every agent position N minutes before the close,
  # win or lose - no overnight holds. Needs an intraday timeframe. Keep it
  # set for scalping.
  flat_by_minutes_before_close: 10    # scalps never hold overnight
  # Per stock, per exchange day: no new entries in a symbol once its closed
  # trades today lost this much in total, or after this many losing trades in
  # it. Other symbols keep trading; exits are never blocked.
  max_symbol_loss_per_day: null       # e.g. 150 (account currency)
  max_losses_per_symbol_per_day: 3
  # Daily profit target: once today's CLOSED P&L reaches it, no new entries
  # until tomorrow. Patterns, indicators, your rules and Kronos keep being
  # evaluated and logged, candles are still collected, and open positions
  # keep their stop, target and trailing stop. With both set, the lower wins.
  daily_profit_target_pct: null       # e.g. 1.0 (% of the account value at the start of the day)
  daily_profit_target: null           # e.g. 500 (account currency)
  blocked_symbols: []               # e.g. ["US.GME", "TSLA"]

# Market calendar. With follow_market the agent scans only while the
# exchange is open - NYSE/Nasdaq holidays and 1 pm early closes included -
# warms up `warmup_minutes` before the open (OpenD check + fresh screener
# run), and otherwise sleeps, checking positions every
# `sleep_monitor_seconds`. Telegram gets an open / close message.
# Ignored (always on) when trade_outside_market_hours is true.
schedule:
  follow_market: true
  warmup_minutes: 15
  sleep_monitor_seconds: 300
  notify_open_close: true

# OpenD connection. Every connect attempt is bounded, so an OpenD that is
# running but not logged in can't freeze the agent. A health ping runs
# every `health_check_seconds`; after `reconnect_after_failures` failed
# pings the connection is rebuilt. Trading pauses while OpenD is down.
connection:
  connect_timeout_seconds: 35
  health_check_seconds: 60
  reconnect_after_failures: 3

# Broker positions/orders the agent didn't open (placed by hand, or left
# by another program). mode: alert (Telegram + dashboard banner, once per
# symbol) or off. close_missing_positions: an agent position the broker
# no longer holds - and whose exit orders didn't fill - is marked closed
# after a few minutes instead of being monitored forever.
unmanaged_positions:
  mode: alert
  check_interval_seconds: 300
  close_missing_positions: true
  # Holdings the agent did not open (your long-term shares in the same
  # account) are protected: the agent never sells them, never trades a
  # symbol you already hold, and the dashboard's Close button is not shown
  # for them. Set true only if you want to close them from the dashboard.
  allow_manual_close: false

polling_interval_seconds: 15

# Scalp trade management (every agent trade, Kronos or skill file).
scalp:
  # Time stop: close a trade that hasn't hit its stop or target after this
  # many minutes, at the market. Empty = off.
  max_hold_minutes: 30           # 10 x 3-minute candles
  # Break-even: once a trade is this many R in profit (R = its initial
  # risk), move the stop to the entry. Empty = off.
  breakeven_at_r: 1.0
  # ...plus this % beyond the entry, so a break-even exit still covers costs.
  breakeven_offset_pct: 0.02

# Market Sentiment Meter (dashboard only - never affects trading).
# Reads benchmark ETFs for the broker's market and labels the market
# Up trend / Down trend / Sideways / Stable with a -100..100 needle.
sentiment:
  enabled: true
  timeframe: MIN_3           # mood on the scalping chart; MIN_15 / HOUR_1 = intraday trend; DAY = the market's trend
  lookback_bars: 250
  refresh_minutes: 15        # cached between readings (broker data limits)
  adx_trend: 20              # ADX at or above this counts as trending
  breadth_symbols: 15        # % of the agent's active symbols above EMA50 (0 = off)
  benchmarks:                # leave a market out to use the defaults:
    # US: [US.SPY, US.QQQ, US.IWM]               S&P 500, Nasdaq 100, Russell 2000
    # SG: [SG.ES3, SG.G3B]                       STI ETFs
    # HK: [HK.02800, HK.03033]                   Hang Seng, Hang Seng Tech
    # NSE: [NSE.NIFTYBEES, NSE.BANKBEES, NSE.JUNIORBEES]

# ---------------------------------------------------------------------------
# Brokers. Every setting above is SHARED. Each broker below can override
# any of them for itself only - nested sections merge, so write just the
# keys that differ. Several enabled brokers run in one process, each with
# its own connection, audit DB (data/audit_<name>.db; moomoo keeps
# data/audit.db), risk state, screener and market calendar. They share one
# offline Kronos model (the kronos: section is shared-only).
# Credentials stay in .env. Restart main.py after changing this.
#   adapter  moomoo | tiger | ig, zerodha, angel (experimental)
#   market   overrides the market set in .env for that broker
# ---------------------------------------------------------------------------
brokers:
  moomoo:
    enabled: true            # trades the shared settings above as-is

  tiger:                     # Tiger Brokers (tigeropen) - TIGER_* in .env
    enabled: false
    market: SG               # SGX
    timeframe: HOUR_1
    default_quantity: 100
    risk:
      lot_size: 100          # SGX board lot
      max_daily_loss: 300.0  # SGD
    screener:
      candidate_symbols: [SG.D05, SG.O39, SG.U11, SG.Z74, SG.C6L]
      min_price: 1.0
      max_price: 100.0
      min_avg_volume: 20000

  ig:                        # IG REST API - EXPERIMENTAL, IG_* in .env, use a DEMO account
    enabled: false
    # IG24 = around the clock: forex, indices, commodities and crypto CFDs,
    # each on its own hours, candles streamed live (pip install
    # lightstreamer-client-lib). US / HK / SG = one exchange session.
    market: IG24
    default_quantity: 1      # deal size (contracts) - check each market's value per point
    risk:
      allow_short: true      # CFDs: both directions
      flat_by_minutes_before_close: 10   # before each market's daily break / weekend close
      no_entries_first_minutes: 5        # after each market's own open
      no_entries_last_minutes: 15        # before each market's own close
    screener:
      enabled: true
      candidate_symbols: []  # optional extra IG epics, always ranked too
      around_the_clock:      # used when market is IG24
        markets: [forex, indices, commodities, crypto]
        max_watch: 30        # markets streamed and scanned (IG streaming limit: 40)
        refresh_minutes: 15  # re-rank from price snapshots (no history allowance used)
        max_spread_pct: 0.2  # forex / indices / commodities
        crypto_max_spread_pct: 1.5
        min_range_pct: 0.1   # skip markets that have hardly moved today
        seed_bars: 150       # history candles fetched once per new market
        universe_refresh_hours: 24
        max_nav_nodes: 120   # IG market-menu pages read per discovery (~4 min, background)

  zerodha:                   # Zerodha Kite Connect - KITE_* in .env, run kite_login.py daily (EXPERIMENTAL)
    enabled: false
    market: NSE
    # Zerodha's free "Personal" API plan has NO market data (the paid
    # Connect plan does). Uncomment to read every price - candles for
    # patterns and Kronos, the screener, live prices for stops - from Angel
    # One's free API instead. Orders, positions and funds stay with Zerodha.
    # Needs the ANGEL_* login in .env; angel itself can stay `enabled: false`.
    # data_source: angel
    default_quantity: 5      # shares - no paper account, start small
    risk:
      allow_short: false     # not tested yet for MIS shorts
      lot_size: 1
      max_daily_loss: 2000.0 # INR
      flat_by_minutes_before_close: 15   # before Zerodha's ~15:20 MIS square-off
    screener:
      candidate_symbols: [NSE.RELIANCE, NSE.HDFCBANK, NSE.ICICIBANK, NSE.INFY, NSE.TCS,
                          NSE.SBIN, NSE.LT, NSE.AXISBANK, NSE.BHARTIARTL, NSE.ITC]
      min_price: 100.0
      max_price: 5000.0
      min_avg_volume: 20000  # per 5-minute bar

  angel:                     # Angel One SmartAPI - ANGEL_* in .env, TOTP login is automatic (EXPERIMENTAL)
    enabled: false
    market: NSE
    default_quantity: 5
    risk:
      allow_short: false     # not tested yet for INTRADAY shorts
      lot_size: 1
      max_daily_loss: 2000.0 # INR
      flat_by_minutes_before_close: 15   # before Angel One's intraday square-off
    screener:
      candidate_symbols: [NSE.RELIANCE, NSE.HDFCBANK, NSE.ICICIBANK, NSE.INFY, NSE.TCS,
                          NSE.SBIN, NSE.LT, NSE.AXISBANK, NSE.BHARTIARTL, NSE.ITC]
      min_price: 100.0
      max_price: 5000.0
      min_avg_volume: 20000
